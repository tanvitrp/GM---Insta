<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="login-page">

<div class="login-box">

<h1 class="logo">GMinsta</h1>

<form method="POST" action="/register" enctype="multipart/form-data" id="registerForm">
<input name="username" placeholder="Username" pattern="^[a-zA-Z0-9_]{3,20}$" title="Username must be 3-20 characters, only letters, numbers, and underscore" required>
<input type="email" name="email" placeholder="Email" title="Please enter a valid email address" required>
<input type="password" name="password" placeholder="Password" minlength="6" title="Password must be at least 6 characters" required>
<input type="file" name="profilePic" accept="image/*">
<button type="submit">Sign up</button>
<div id="error-message" style="color: red; display: none; margin-top: 10px;"></div>
</form>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
  const username = document.querySelector('input[name="username"]').value;
  const email = document.querySelector('input[name="email"]').value;
  const password = document.querySelector('input[name="password"]').value;
  const errorMsg = document.getElementById('error-message');
  
  // Username validation
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
    errorMsg.textContent = 'Username must be 3-20 characters with only letters, numbers, and underscore';
    errorMsg.style.display = 'block';
    e.preventDefault();
    return;
  }
  
  // Email validation
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errorMsg.textContent = 'Please enter a valid email address';
    errorMsg.style.display = 'block';
    e.preventDefault();
    return;
  }
  
  // Password validation
  if (password.length < 6) {
    errorMsg.textContent = 'Password must be at least 6 characters';
    errorMsg.style.display = 'block';
    e.preventDefault();
    return;
  }
  
  errorMsg.style.display = 'none';
});
</script>

<p class="or">OR</p>

<a href="/login">Already have an account? Log in</a>

</div>

</div>

</body>
</html>
